name: devdigest

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devdigest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devdigest
      POSTGRES_PASSWORD: devdigest
      POSTGRES_DB: devdigest
    ports:
      # Local development uses 5555 so it can coexist with the other project.
      # CI overrides DEV_PG_PORT to 5432 in .github/workflows/e2e-web.yml.
      - "${DEV_PG_PORT:-5555}:5432"
    volumes:
      - devdigest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdigest -d devdigest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devdigest_pgdata:
    name: devdigest_pgdata
