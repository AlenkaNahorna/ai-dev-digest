# Harness evals — skills, subagents and the CLAUDE.md workflow, run on OpenRouter.
#
# Per PR, scripts/ci-detect.mjs maps changed files onto eval suites:
#   .claude/skills/<n>/**      → evals/skills/<n>   (+ every agent that references the skill)
#   .claude/agents/<n>.md      → evals/agents/<n>   (+ the workflow tier)
#   CLAUDE.md / AGENTS.md      → workflow tier
# An artifact with no written evals is reported as a "SKIP" notice, never as a failure.
#
# Models (all on OpenRouter; override via workflow_dispatch inputs or repo variables):
#   skills          → deepseek/deepseek-chat  (cheap; verified for the content tier)
#   agents          → openai/gpt-4.1-mini     (follows the strict report template better); judge stays deepseek
#   workflow        → google/gemini-2.5-flash (the only cheap model verified to dispatch subagents)
#
# Requires the Actions secret OPENROUTER_API_KEY. PRs from forks have no secrets → jobs are skipped.
name: evals

on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.claude/agents/**'
      - '.agents/skills/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'evals/skills/**'
      - 'evals/agents/**'
      - 'evals/workflow/**'
  workflow_dispatch:
    inputs:
      model:
        description: 'OpenRouter model for skills evals'
        default: 'deepseek/deepseek-chat'
      agent_model:
        description: 'OpenRouter model for the agents tier (the model under test)'
        default: 'openai/gpt-4.1-mini'
      judge_model:
        description: 'OpenRouter model for the agents-tier judge'
        default: 'deepseek/deepseek-chat'
      workflow_model:
        description: 'OpenRouter model for the workflow tier'
        default: 'google/gemini-2.5-flash'
      scope:
        description: 'Which suites to run'
        type: choice
        default: all
        options: [all, skills, agents, workflow]

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      skills: ${{ steps.d.outputs.skills }}
      agents: ${{ steps.d.outputs.agents }}
      run_workflow: ${{ steps.d.outputs.run_workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: d
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA"...HEAD)"
          else
            # Manual run: pretend every eval file (and the engine) changed.
            CHANGED_FILES="$(git ls-files evals/skills evals/agents evals/workflow; echo evals/src/manual)"
          fi
          export CHANGED_FILES
          node evals/scripts/ci-detect.mjs
          # Manual scope narrowing
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$SCOPE" != "all" ]; then
            [ "$SCOPE" != "skills" ]   && echo "skills=[]" >> "$GITHUB_OUTPUT"
            [ "$SCOPE" != "agents" ]   && echo "agents=[]" >> "$GITHUB_OUTPUT"
            [ "$SCOPE" != "workflow" ] && echo "run_workflow=false" >> "$GITHUB_OUTPUT"
          fi
          true

  skills:
    name: skill / ${{ matrix.name }}
    needs: detect
    if: needs.detect.outputs.skills != '[]' && needs.detect.outputs.skills != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        name: ${{ fromJSON(needs.detect.outputs.skills) }}
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_MODEL: ${{ inputs.model || vars.EVAL_MODEL || 'deepseek/deepseek-chat' }}
      EVAL_JUDGE_MODEL: ${{ inputs.model || vars.EVAL_MODEL || 'deepseek/deepseek-chat' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Content tier talks to OpenRouter directly — no proxy needed.
      - run: pnpm exec vitest run "skills/${{ matrix.name }}/"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-skill-${{ matrix.name }}
          path: evals/results/
          if-no-files-found: ignore

  agents:
    name: agent / ${{ matrix.name }}
    needs: detect
    if: needs.detect.outputs.agents != '[]' && needs.detect.outputs.agents != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        name: ${{ fromJSON(needs.detect.outputs.agents) }}
    defaults:
      run:
        working-directory: evals
    env:
      OPENROUTER_BASE_URL: http://localhost:4000
      EVAL_MODEL: ${{ inputs.agent_model || vars.EVAL_AGENT_MODEL || 'openai/gpt-4.1-mini' }}
      EVAL_JUDGE_MODEL: ${{ inputs.judge_model || vars.EVAL_JUDGE_MODEL || 'deepseek/deepseek-chat' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - run: pnpm exec vitest run --bail=1 "agents/${{ matrix.name }}/"
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-agent-${{ matrix.name }}
          path: evals/results/
          if-no-files-found: ignore

  workflow:
    name: workflow
    needs: detect
    if: needs.detect.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: evals
    env:
      OPENROUTER_BASE_URL: http://localhost:4000
      EVAL_MODEL: ${{ inputs.workflow_model || vars.EVAL_WORKFLOW_MODEL || 'google/gemini-2.5-flash' }}
      EVAL_JUDGE_MODEL: ${{ inputs.workflow_model || vars.EVAL_WORKFLOW_MODEL || 'google/gemini-2.5-flash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - run: pnpm eval:workflow --bail=1
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-workflow
          path: evals/results/
          if-no-files-found: ignore
