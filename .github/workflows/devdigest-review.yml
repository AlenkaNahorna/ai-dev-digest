# DevDigest CI review — generated by Export to CI. Review before merging.
# devdigest-workflow-version: 2
name: DevDigest Review

on:
  pull_request:
    types: [opened, synchronize]

# Least-privilege token (AC-11): read code, write PR reviews/comments. Nothing else.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Fork safety (AC-12): skip PRs opened from a fork — no secrets are exposed
    # to untrusted code. We use pull_request (not pull_request_target), so the
    # checked-out code never runs with repo secrets for fork PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run DevDigest review
        # Untrusted PR data (title/body/diff/branch) is NEVER interpolated into
        # this script (AC-13). The runner reads the PR number from PR_NUMBER and
        # the title/body from the event payload file as data, not shell text.
        run: node .devdigest/runner/index.js
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEVDIGEST_INGEST_TOKEN: ${{ secrets.DEVDIGEST_INGEST_TOKEN }}
          DEVDIGEST_API_URL: ${{ vars.DEVDIGEST_API_URL }}
          DEVDIGEST_POST_AS: github_review
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
