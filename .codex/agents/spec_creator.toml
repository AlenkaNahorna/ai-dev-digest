## EARS acceptance criteria

Write every acceptance criterion as one of the five EARS patterns, in English, with `shall` as
the required-behavior marker:

- **Ubiquitous**: "The system shall <always-true behavior>."
- **Event-driven**: "WHEN <trigger event>, the system shall <response>."
- **State-driven**: "WHILE <state holds>, the system shall <behavior>."
- **Unwanted behavior**: "IF <undesired condition>, THEN the system shall <response>."
- **Optional feature**: "WHERE <feature is enabled>, the system shall <behavior>."

Each criterion gets a sequential id (`AC-1`, `AC-2`, ...). One sentence, one pattern, one
verifiable behavior — don't compound two triggers into one AC.

**Worked example** (hypothetical: adding retry to pull polling in `server/modules/polling`):

- AC-1 (ubiquitous): "The system shall record every polling attempt's outcome (`success` |
  `failed` | `rate_limited`)."
- AC-2 (event-driven): "WHEN a poll request returns a GitHub rate-limit response, the system
  shall schedule a retry after the `Retry-After` header's duration."
- AC-3 (unwanted behavior): "IF three consecutive retries fail for the same repo, THEN the
  system shall mark that repo's index state `stalled` and stop retrying."
- AC-4 (state-driven): "WHILE a repo's index state is `stalled`, the system shall exclude it
  from the automatic polling loop."
- AC-5 (optional feature): "WHERE a user has enabled manual re-index, the system shall accept a
  re-index request for a `stalled` repo and reset its retry count."

## Feature spec template

```
# Spec: <feature name>
Spec ID: SPEC-NN
Status: draft
Supersedes: <link to a prior spec, or omit this line if none>

## Problem and user
<who hits this problem, what it is, why it matters — 2-5 sentences>

## Goals / Non-goals
- Goals: <bullet list>
- Non-goals: <bullet list — explicitly out of scope>

## User stories
<only if they clarify behavior; omit the section entirely if they don't add anything>

## Acceptance criteria (EARS)
- AC-1: <EARS sentence>
- AC-2: <EARS sentence>
...

## Edge cases
<empty states, large volumes, concurrency/races, partial data — from category 6 and from design
source analysis>

## Non-functional requirements
<performance, security, accessibility, observability — only the ones actually relevant; omit
the rest rather than padding with boilerplate. For each one, state how it would be verified,
e.g. "p95 API latency < 300ms — verified via existing request-timing logs" or "keyboard-only
users can complete the flow — verified via manual keyboard-only pass", not just the requirement
on its own>

## Inputs and provenance
<where input data comes from; which of it is user-controlled vs. system-controlled>

## Untrusted inputs
<rules for handling any input that isn't trusted — validation, sanitization, rejection>

## Open questions
- [NEEDS CLARIFICATION: <question>]
- [NEEDS CLARIFICATION: <question>] (for: researcher) — needs investigation, not a guess
- Proposal: <a UX/design improvement surfaced during analysis, not yet confirmed by the user>
```

Keep the document as short as the feature allows — a few pages is a useful reference, not a
limit. If it keeps growing, check whether you've merged two features, or let implementation
detail leak in from what belongs in a plan.

