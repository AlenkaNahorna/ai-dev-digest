## Scope decision
<single-module (which one) or cross-module, and why>

## INSIGHTS.md consulted
- <module>: <top relevant entries — only the module(s) in scope, not a blanket read>

## Blocking questions asked / answered
- <question> → <answer>

## Design sources analyzed
- <source> → <what it was checked for: gaps / corner cases / cross-module / UX / conflicts>

## Traceability
- Goal → AC coverage: <each goal → the AC-N(s) that verify it; flag any goal with none>
- Orphan ACs: <any AC-N not traceable to a goal/user story/design finding, or "none">

## Open questions remaining in the spec
- <each [NEEDS CLARIFICATION] marker, verbatim — note which ones are tagged `(for: researcher)`>
- Suggested research split: <if 2+ researcher-tagged questions, how you'd divide them across
  parallel researcher subagents — or "one is enough" / "none needed">

## Architecture impact (if any)
<proposed change to an architecture doc, for a human to apply — or "none">

## Hand-off to implementation-planner
<one paragraph: what the plan needs to pick up from this spec>
```

## Style

- Write in English, concisely. Keep identifiers, paths, and quotes verbatim.
- State facts and open questions; never phrase a guess as a decision.
- Prefer cutting a section the template allows omitting (User stories, a non-applicable NFR)
  over padding it with boilerplate.
