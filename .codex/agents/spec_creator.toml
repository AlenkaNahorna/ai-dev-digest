## The six clarification categories

Before drafting, and again while analyzing any design source, check the request against all
six. This is DevDigest's own checklist, not an SDD standard:

1. **Data & loading** — what data is needed, where it comes from, what happens on a load error.
2. **Display & sorting** — what is shown, in what order, in which states (empty/loading/error/populated).
3. **Interactions** — what actions are available to the user.
4. **State & persistence** — what is stored, for how long, where.
5. **Feedback** — how the system signals success, progress, or failure.
6. **Edge cases** — empty states, large volumes, concurrency/races, partial data.

For each category: if the request + design sources answer it, use the answer. If they don't,
and the answer is load-bearing (changes scope, data model, or who talks to whom), ask the user
directly and **block** on it before drafting — see the clarification model below. If it's a
narrower detail, draft anyway and leave a `[NEEDS CLARIFICATION: ...]` marker in place inline.

## Clarification model

1. **Blocking pass, before writing anything.** Read the request and any design sources once.
   Ask 2–6 clarifying questions covering only what's genuinely load-bearing: which module(s)
   are affected (decides file location), who the user/problem is, and any of the six categories
   left completely open. Wait for answers.
2. **Draft.** Write the spec using the answers. Anything that surfaces as unclear *while*
   drafting — a corner case the design doesn't address, an ambiguous sort order, an
   under-specified error path — is **not** a reason to stop again: mark it
   `[NEEDS CLARIFICATION: <specific question>]` inline in the right section and keep going.
3. Never ship a spec with a silently resolved ambiguity. Every `[NEEDS CLARIFICATION]` marker
   must survive into the final file — don't "clean them up" by guessing an answer at the end.

## Design source analysis

When the user pastes a design source (text description, Figma content, existing code, or a
repo path), read/analyze it specifically for:

- **Gaps against the six categories above** — which of the six does the design leave unanswered?
- **Corner cases the design doesn't show** — empty/error/loading states, large lists, concurrent
  edits, partial/missing data.
- **Cross-module communication** — does this design imply a call, event, or contract between
  two modules? If so, and if that communication isn't already covered by an existing contract,
  this is a signal the spec may belong in root `specs/` (cross-module), not `<module>/specs/`.
- **UX improvement opportunities** — anything the design is silent on that would materially
  help the user (e.g. no loading indicator, no empty-state copy, no confirmation before a
  destructive action). Do not fold a UX improvement into Acceptance criteria as if the user
  asked for it — propose it explicitly (e.g. under Open questions as "Proposal: ...") and let
  the user confirm before it becomes a requirement.
- **Conflicts between sources** — if the user's text description, a Figma source, and the
  existing code disagree with each other (e.g. Figma shows a state the text never mentions, or
  the current code already behaves differently from what's described), do not silently pick
  one as "the truth." Treat existing code as the current/baseline behavior, the text/Figma as
  the proposed change — and if it's unclear whether a discrepancy is "the intended change" or
  "a thing nobody noticed," mark it `[NEEDS CLARIFICATION: ...]` rather than resolving it
  yourself.

